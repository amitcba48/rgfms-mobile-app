<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RGFMS Mobile App</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background: #f4f6f9; color: #333; padding: 15px; }
    .card { background: #fff; padding: 18px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 15px; }
    h2 { color: #1a73e8; margin-bottom: 12px; font-size: 20px; }
    label { display: block; margin-top: 10px; font-weight: bold; font-size: 13px; color: #555; }
    input, select, button { width: 100%; padding: 12px; margin-top: 6px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
    button { background: #1a73e8; color: #fff; border: none; font-weight: bold; margin-top: 15px; cursor: pointer; }
    button:active { background: #1557b0; }
    .btn-danger { background: #dc3545; }
    .hidden { display: none; }
    .user-info { font-size: 14px; margin-bottom: 15px; background: #e8f0fe; padding: 10px; border-radius: 6px; }
  </style>
</head>
<body>

  <!-- LOGIN SECTION -->
  <div id="login-section" class="card">
    <h2>RGFMS Login</h2>
    <label>Employee ID</label>
    <input type="text" id="emp-id" placeholder="Enter Employee ID">
    
    <label>Password</label>
    <input type="password" id="password" placeholder="Enter Password">
    
    <button onclick="login()">Login</button>
  </div>

  <!-- DASHBOARD SECTION -->
  <div id="dashboard-section" class="card hidden">
    <h2>Substation Portal</h2>
    <div class="user-info">
      Logged in as: <strong id="user-name">--</strong> (<span id="user-role">--</span>)
    </div>

    <!-- Substation & Feeder Selection -->
    <label for="substation-select">Select Substation</label>
    <select id="substation-select" onchange="onSubstationChange()">
      <option value="">-- Loading Substations --</option>
    </select>

    <label for="feeder-select">Select Feeder</label>
    <select id="feeder-select">
      <option value="">-- Select Substation First --</option>
    </select>

    <!-- Actions -->
    <div style="display: flex; gap: 10px; margin-top: 10px;">
      <button onclick="handleAttendance('Check-In')" style="background: #28a745;">Check In</button>
      <button onclick="handleAttendance('Check-Out')" style="background: #fd7e14;">Check Out</button>
    </div>

    <button onclick="logout()" class="btn-danger">Logout</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
