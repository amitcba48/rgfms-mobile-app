<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RGFMS Mobile</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background: #f4f6f9; color: #333; padding: 15px; }

    .header-title { text-align: center; margin-bottom: 20px; }
    .header-title h2 { color: #1a73e8; font-size: 22px; }
    .header-title p { color: #666; font-size: 13px; margin-top: 4px; }

    .card { background: #ffffff; border-radius: 10px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 15px; }
    
    label { display: block; font-weight: bold; font-size: 13px; color: #444; margin-top: 12px; margin-bottom: 5px; }
    input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; outline: none; background: #fff; }
    input:focus, select:focus { border-color: #1a73e8; }

    /* USER PROFILE & TIMESTAMPS */
    .user-info { background: #e8f0fe; padding: 14px; border-radius: 8px; margin-bottom: 15px; border-left: 4px solid #1a73e8; }
    .user-name { font-size: 16px; font-weight: bold; color: #1a73e8; }
    .time-badge { font-size: 12px; color: #555; margin-top: 4px; display: block; }
    .status-badge { font-size: 12px; color: #28a745; font-weight: bold; margin-top: 4px; display: block; }

    /* BUTTON STYLES */
    .btn { width: 100%; padding: 13px; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 15px; }
    .btn-primary { background: #1a73e8; color: #fff; }
    .btn-success { background: #28a745; color: #fff; }
    .btn-warning { background: #fd7e14; color: #fff; }
    .btn-danger { background: #dc3545; color: #fff; margin-top: 25px; }

    .action-row { display: flex; gap: 10px; margin-top: 10px; }
    .action-row .btn { flex: 1; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="header-title">
    <h2>RGFMS Mobile</h2>
    <p>Rudra Geotech Field Management System</p>
  </div>

  <!-- LOGIN SECTION -->
  <div id="login-section" class="card">
    <h3 style="margin-bottom: 15px; color: #333;">Login</h3>
    
    <label for="emp-id">Employee ID</label>
    <input type="text" id="emp-id" placeholder="Enter Employee ID">

    <label for="password">Password</label>
    <input type="password" id="password" placeholder="Enter Password">

    <button id="login-btn" class="btn btn-primary" type="button" onclick="login()">Log In</button>
  </div>

  <!-- DASHBOARD SECTION -->
  <div id="dashboard-section" class="card hidden">
    <!-- User Info & Timestamps -->
    <div class="user-info">
      <div class="user-name" id="user-name">--</div>
      <div style="font-size: 13px; color: #666; margin-top: 2px;"><strong>Role:</strong> <span id="user-role">--</span></div>
      <span class="time-badge">🕒 <strong>Current Time:</strong> <span id="current-time">--:--:--</span></span>
      <span class="status-badge">📍 <strong>Check-In Status:</strong> <span id="checkin-status">Not Checked In</span></span>
    </div>

    <!-- Substation & Feeder Dropdowns -->
    <label for="substation-select">Select Substation</label>
    <select id="substation-select" onchange="onSubstationChange()">
      <option value="">-- Loading Substations --</option>
    </select>

    <label for="feeder-select">Select Feeder</label>
    <select id="feeder-select">
      <option value="">-- Select Substation First --</option>
    </select>

    <!-- Action Buttons -->
    <div class="action-row">
      <button class="btn btn-success" onclick="handleAttendance('Check-In')">Check In</button>
      <button class="btn btn-warning" onclick="handleAttendance('Check-Out')">Check Out</button>
    </div>

    <button class="btn btn-danger" onclick="logout()">Sign Out</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
